name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  LM_CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache -DFETCHCONTENT_UPDATES_DISCONNECTED=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tools
        run: |
          pip install ninja
          rustup target add aarch64-linux-android
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 2G
      - name: Build folder (cache)
        uses: actions/cache@v4
        with:
          path: |
            build/android-arm64
            ~/.cargo/registry
            ~/.cargo/git
          key: android-build-v2-${{ hashFiles('extern/aurora/cmake/AuroraDependencyVersions.cmake', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            android-build-v2-${{ hashFiles('extern/aurora/cmake/AuroraDependencyVersions.cmake', 'CMakeLists.txt') }}-
            android-build-v2-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          validate-wrappers: false
      - name: Build
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          tc="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android29-clang"
          export CXX_aarch64_linux_android="$tc/aarch64-linux-android29-clang++"
          export AR_aarch64_linux_android="$tc/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android29-clang"
          export CARGO_INCREMENTAL=0
          tools/mobile/build_android.sh
          ccache -s
      - name: Name
        run: |
          v=$(sed -nE 's/^project\(lmport .*VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)
          sha256sum build/*.apk
          echo "PKG=build/LuigisMansionRecompiled-$v-android-arm64.apk" >> "$GITHUB_ENV"
          echo "PKG_NAME=LuigisMansionRecompiled-$v-android-arm64.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG }}
          if-no-files-found: error
          compression-level: 0

  ios:
    name: iOS arm64 (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tools
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          clang --version | head -1
          brew install ninja
          rustup target add aarch64-apple-ios
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-arm64
          max-size: 2G
      - name: Build folder (cache)
        uses: actions/cache@v4
        with:
          path: |
            build/ios-arm64
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-build-v2-${{ hashFiles('extern/aurora/cmake/AuroraDependencyVersions.cmake', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ios-build-v2-${{ hashFiles('extern/aurora/cmake/AuroraDependencyVersions.cmake', 'CMakeLists.txt') }}-
            ios-build-v2-
      - name: Build
        run: |
          export CARGO_INCREMENTAL=0
          tools/mobile/build_ios.sh
          ccache -s
      - name: Name
        run: |
          v=$(sed -nE 's/^project\(lmport .*VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)
          shasum -a 256 build/*.ipa
          echo "PKG=build/LuigisMansionRecompiled-$v-ios-arm64-unsigned.ipa" >> "$GITHUB_ENV"
          echo "PKG_NAME=LuigisMansionRecompiled-$v-ios-arm64-unsigned.ipa" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG }}
          if-no-files-found: error
          compression-level: 0
